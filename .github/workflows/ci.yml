name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (including reachable history for privacy checks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare build tooling
        run: python -m pip install --upgrade pip setuptools

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m py_compile src/grocery_agent_kit/*.py scripts/extract_safeway_weekly_ad.py

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Assert removed legacy recipe module is absent
        run: |
          if unzip -l dist/*.whl | grep -q 'recipe_api.py'; then
            echo 'unvetted recipe module was packaged' >&2
            exit 1
          fi
